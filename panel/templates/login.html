{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block bare %}
<div class="login">
  <form method="post" class="card login-card">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="56" height="56">
    <h1>pi-secbox</h1>
    <p class="muted">{{ host }}</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Parola<input type="password" name="password" autocomplete="current-password" autofocus required></label>
    <button class="primary">Giriş</button>
  </form>
</div>
{% endblock %}
