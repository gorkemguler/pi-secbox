{% extends "base.html" %}
{% from "_macros.html" import runs_table %}
{% block title %}Sonuçlar{% endblock %}
{% block content %}
<header class="page-head"><h1>Sonuçlar</h1></header>

{% if targets %}
<nav class="chips">
  <a href="{{ url_for('panel.results_page') }}" class="{{ 'active' if not target }}">Hepsi</a>
  {% for t, label in targets %}
  <a href="{{ url_for('panel.results_page', target=t) }}" class="{{ 'active' if t == target }}">{{ label }}</a>
  {% endfor %}
</nav>
{% endif %}

<section class="card">
  {{ runs_table(runs) }}
</section>
{% endblock %}
