<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="pi-secbox: Raspberry Pi için hafif ağ keşfi ve denetim kutusu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#121a2a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb4f7c"/>
      <stop offset="1" stop-color="#a3123f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c2638" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#e0245e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e0245e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- logo -->
  <g transform="translate(64 70) scale(1.75)">
    <path d="M24 5.5c2.5 1.6 5 1.6 8 0 3 1.6 5.5 1.6 8 0" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 9 52 15.5V31c0 12.6-8.4 21.3-20 26.5C20.4 52.3 12 43.6 12 31V15.5z" fill="url(#shield)"/>
    <path d="M22.5 25.5 30 31.5l-7.5 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M33.5 40h9" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="196" y="160" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="#e5e9f0"><tspan fill="#fb4f7c">pi</tspan>-secbox</text>
  <text x="68" y="236" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#a3adbf">Raspberry Pi için hafif ağ keşfi ve denetim kutusu</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">
    <g transform="translate(68 272)">
      <rect width="148" height="34" rx="17" fill="#172031" stroke="#2a3850"/>
      <text x="74" y="22" text-anchor="middle">nmap · nuclei</text>
    </g>
    <g transform="translate(228 272)">
      <rect width="80" height="34" rx="17" fill="#1f1636" stroke="#4c3a7a"/>
      <text x="40" y="22" text-anchor="middle" fill="#c4b5fd">Tor</text>
    </g>
    <g transform="translate(320 272)">
      <rect width="124" height="34" rx="17" fill="#0f2a22" stroke="#1f5c47"/>
      <text x="62" y="22" text-anchor="middle" fill="#6ee7b7">web paneli</text>
    </g>
    <g transform="translate(456 272)">
      <rect width="104" height="34" rx="17" fill="#172031" stroke="#2a3850"/>
      <text x="52" y="22" text-anchor="middle">zamanlama</text>
    </g>
    <g transform="translate(572 272)">
      <rect width="120" height="34" rx="17" fill="#2a1a0c" stroke="#7a4a17"/>
      <text x="60" y="22" text-anchor="middle" fill="#fdba74">Cloudflare</text>
    </g>
  </g>
  <text x="68" y="350" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6b778c">Raspberry Pi OS Lite · tek kurulum betiği · MIT</text>

  <!-- terminal -->
  <g transform="translate(746 54)">
    <rect width="478" height="292" rx="12" fill="#05080d" stroke="#233047"/>
    <rect width="478" height="34" rx="12" fill="#111723"/>
    <rect y="22" width="478" height="12" fill="#111723"/>
    <circle cx="20" cy="17" r="6" fill="#f87171"/>
    <circle cx="40" cy="17" r="6" fill="#fbbf24"/>
    <circle cx="60" cy="17" r="6" fill="#34d399"/>
    <text x="239" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6b778c">pi@pisecbox: ~</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
      <text x="18" y="66" fill="#e5e9f0"><tspan fill="#34d399">$</tspan> pisec scan hedef.com --tor</text>
      <text x="18" y="90" fill="#8a96aa">[+] Tor çıkış IP'si: 198.51.100.23</text>
      <text x="18" y="114" fill="#8a96aa">| 203.0.113.10 | 443/tcp | https |</text>
      <text x="18" y="146" fill="#e5e9f0"><tspan fill="#34d399">$</tspan> pisec schedule add daily recon hedef.com</text>
      <text x="18" y="170" fill="#8a96aa">[+] Görev eklendi: recon-hedef.com</text>
      <text x="18" y="202" fill="#e5e9f0"><tspan fill="#34d399">$</tspan> pisec publish 8081</text>
      <text x="18" y="226" fill="#8a96aa">[+] Yayında: https://quiet-river.trycloudflare.com</text>
      <text x="18" y="258" fill="#e5e9f0"><tspan fill="#34d399">$</tspan> pisec panel start</text>
      <text x="18" y="282" fill="#8a96aa">Panel: active  <tspan fill="#6b778c">http://127.0.0.1:8090</tspan></text>
    </g>
  </g>
</svg>
